name: Supernova Python research audit
on:
  push:
    branches: ["research/**"]
  pull_request:
  workflow_dispatch:
jobs:
  scientific-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests -p test_sn_robustness.py -v
      - run: python scripts/sn_robustness.py --output /tmp/sn_robustness.json
      - run: npm run check
